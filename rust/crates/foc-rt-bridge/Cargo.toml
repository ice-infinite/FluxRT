[package]
name = "foc-rt-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
stm32g4-cordic = []
fast-math-benchmark = []
fast-math-candidate = ["fast-math-benchmark"]
motion-control = ["foc-control/motion-control"]
advanced-foc = ["foc-control/advanced-foc"]
power-management = []
external-inputs = ["dep:foc-input"]
native-protocol = ["dep:foc-protocol"]

[lib]
name = "foc_rt_bridge"
crate-type = ["staticlib", "rlib"]

[dependencies]
foc-algorithm = { path = "../foc-algorithm" }
foc-control = { path = "../foc-control" }
foc-input = { path = "../foc-input", optional = true }
foc-protocol = { path = "../foc-protocol", optional = true }
