[package]
name = "foc-sim"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
foc-algorithm = { path = "../foc-algorithm" }
foc-control = { path = "../foc-control", features = ["motion-control", "advanced-foc"] }
foc-rt-bridge = { path = "../foc-rt-bridge" }

[lib]
name = "foc_sim"
path = "src/lib.rs"

[[bin]]
name = "foc-sim"
path = "src/main.rs"

[[bin]]
name = "foc-bringup-sim"
path = "src/bringup_main.rs"

[[bin]]
name = "foc-contract-check"
path = "src/contract_main.rs"

[[bin]]
name = "foc-feedback-contract-check"
path = "src/feedback_contract_main.rs"

[[bin]]
name = "foc-motion-contract-check"
path = "src/motion_contract_main.rs"

[[bin]]
name = "foc-advanced-contract-check"
path = "src/advanced_contract_main.rs"

[[bin]]
name = "foc-full-speed-contract-check"
path = "src/full_speed_contract_main.rs"

[[bin]]
name = "foc-hfi-contract-check"
path = "src/hfi_contract_main.rs"

[[bin]]
name = "foc-hfi-dynamic-contract-check"
path = "src/hfi_dynamic_contract_main.rs"

[[bin]]
name = "foc-sensorless-full-speed-contract-check"
path = "src/sensorless_full_speed_contract_main.rs"

[[bin]]
name = "foc-lsi-h2-replay-contract-check"
path = "src/lsi_h2_replay_contract_main.rs"
