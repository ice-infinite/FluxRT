[workspace]
resolver = "2"
members = [
    "crates/foc-algorithm",
    "crates/foc-control",
    "crates/foc-rt-bridge",
    "crates/foc-sim",
]

[profile.release]
codegen-units = 1
lto = true
# STM32G431 size/speed measurements selected `s`: it saved 5,080 bytes over
# `3` while increasing open-loop ISR WCET by about 2%. CMake can override
# this for reproducible 3/s/z comparisons.
opt-level = "s"
panic = "abort"
