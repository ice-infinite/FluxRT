[platformio]
default_envs = dengfoc_usb_angle_diag

[env]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.03.30/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_type = release
extra_scripts = pre:scripts/import_fluxrt_sources.py
build_src_filter =
    +<*>
    -<calibration_main.cpp>
    -<time_sync_main.cpp>
build_flags =
    -DFLUXRT_DENGFOC_DIAGNOSTIC_ONLY=1
    -DFLUXRT_DENGFOC_ENABLE_AXIS1=0
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra

[env:dengfoc_usb_angle_diag]
build_flags =
    ${env.build_flags}
    -DFLUXRT_DENGFOC_PWM_PREPARE_ONLY=0

[env:dengfoc_usb_pwm_prepare]
build_flags =
    ${env.build_flags}
    -DFLUXRT_DENGFOC_PWM_PREPARE_ONLY=1

[env:dengfoc_usb_mcpwm_timing]
build_flags =
    ${env.build_flags}
    -DFLUXRT_DENGFOC_PWM_PREPARE_ONLY=1
    -DFLUXRT_DENGFOC_MCPWM_TIMING_ONLY=1

[env:dengfoc_usb_rust_probe]
extra_scripts =
    ${env.extra_scripts}
    pre:scripts/build_rust_bridge.py
build_flags =
    ${env.build_flags}
    -DFLUXRT_DENGFOC_PWM_PREPARE_ONLY=1
    -DFLUXRT_DENGFOC_MCPWM_TIMING_ONLY=1
    -DFLUXRT_DENGFOC_RUST_PROBE=1

[env:dengfoc_alignment_calibration]
extra_scripts =
    ${env.extra_scripts}
build_src_filter =
    +<*>
    -<main.cpp>
build_flags =
    ${env.build_flags}
    -DFLUXRT_DENGFOC_PWM_PREPARE_ONLY=1
    -DFLUXRT_DENGFOC_MCPWM_TIMING_ONLY=1
    -DFLUXRT_DENGFOC_ALIGNMENT_CALIBRATION=1
monitor_speed = 921600
[env:dengfoc_usb_time_sync_rx]
extra_scripts =
    ${env.extra_scripts}
build_src_filter =
    +<*>
    -<main.cpp>
    -<calibration_main.cpp>
build_flags =
    ${env.build_flags}
    -DFLUXRT_DENGFOC_TIME_SYNC_RX=1
    -DFLUXRT_DENGFOC_SYNC_INPUT_GPIO=23
monitor_speed = 921600
